<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">FixProof evidence-first repair workflow</title>
  <desc id="description">Primary FixProof study: controlled Express fixtures produce Semgrep findings and focused context; a repair model proposes candidate code; a copied workspace is checked by separate syntax, SAST, security, and functional validators; deterministic policy records an outcome and sends selected cases for separate human review. Later supplemental testing reuses saved baselines and candidates under security, behavioral-parity, and robustness cases that were predefined and frozen in the project's internal registry. Follow-up decisions qualify but do not rewrite primary records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516a8d"/>
    </marker>
    <marker id="laterArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aa6d32"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17253b; }
      .title { font-size: 43px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 22px; fill: #4e6079; }
      .band-title { font-size: 25px; font-weight: 700; }
      .band-subtitle { font-size: 17px; fill: #52657d; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-text { font-size: 18px; fill: #3e526d; }
      .small-text { font-size: 16px; fill: #3e526d; }
      .edge-label { font-size: 14px; fill: #3e526d; }
      .policy-text { font-size: 18px; font-weight: 600; fill: #304363; }
      .footer { font-size: 18px; fill: #50637c; }
      .main-edge { fill: none; stroke: #516a8d; stroke-width: 4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .later-edge { fill: none; stroke: #aa6d32; stroke-width: 3.5; stroke-dasharray: 10 8; marker-end: url(#laterArrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="74" class="title">FIXPROOF <tspan fill="#62748d" font-weight="400">| Evidence-first repair workflow</tspan></text>
  <text x="70" y="112" class="subtitle">Python orchestrates: the model proposes code; separate checks, policy, and reviewers assess it.</text>

  <rect x="68" y="145" width="1464" height="382" rx="25" fill="#eef5fd" stroke="#c5d8ec" stroke-width="3"/>
  <text x="91" y="185" class="band-title" fill="#1d4678">PRIMARY-v1</text>
  <text x="270" y="185" class="band-subtitle">Three controlled Express fixtures × five initial repair attempts</text>

  <path d="M 342 290 H 376" class="main-edge"/>
  <path d="M 621 290 H 653" class="main-edge"/>
  <path d="M 890 290 H 922" class="main-edge"/>
  <path d="M 1215 290 H 1244" class="main-edge"/>

  <rect x="92" y="225" width="250" height="130" rx="18" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="217" y="261" class="node-title" text-anchor="middle">Controlled fixtures</text>
  <text x="217" y="291" class="node-text" text-anchor="middle">XSS · SQLi · traversal</text>
  <text x="217" y="320" class="small-text" text-anchor="middle">Semgrep finding + context</text>

  <rect x="376" y="225" width="245" height="130" rx="18" fill="#fff3df" stroke="#d9ae63" stroke-width="3"/>
  <text x="498" y="261" class="node-title" text-anchor="middle">Repair model</text>
  <text x="498" y="292" class="node-text" text-anchor="middle">focused prompt</text>
  <text x="498" y="321" class="small-text" text-anchor="middle">proposes candidate code</text>

  <rect x="653" y="225" width="237" height="130" rx="18" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="771" y="261" class="node-title" text-anchor="middle">Copied workspace</text>
  <text x="771" y="292" class="node-text" text-anchor="middle">apply candidate</text>
  <text x="771" y="321" class="small-text" text-anchor="middle">retain original baseline</text>

  <rect x="922" y="225" width="293" height="130" rx="18" fill="#eaf7f4" stroke="#a7cec5" stroke-width="3"/>
  <text x="1068" y="261" class="node-title" text-anchor="middle">Separate validators</text>
  <text x="1068" y="292" class="node-text" text-anchor="middle">syntax · candidate SAST</text>
  <text x="1068" y="321" class="small-text" text-anchor="middle">security · functional tests</text>

  <rect x="1244" y="225" width="263" height="130" rx="18" fill="#e7edff" stroke="#91a8db" stroke-width="3"/>
  <text x="1375" y="261" class="node-title" text-anchor="middle">Deterministic policy</text>
  <text x="1375" y="288" class="policy-text" text-anchor="middle">Reject</text>
  <text x="1375" y="309" class="policy-text" text-anchor="middle">Ready for human review</text>
  <text x="1375" y="330" class="policy-text" text-anchor="middle">Needs human adjudication</text>

  <path d="M 1268 355 Q 1230 378 1176 397" class="main-edge"/>
  <text x="1077" y="382" class="small-text" text-anchor="middle">selected cases</text>
  <path d="M 1375 355 V 397" class="main-edge"/>
  <text x="1444" y="381" class="edge-label" text-anchor="middle">all outcomes</text>
  <path d="M 1209 443 H 1247" class="main-edge"/>
  <rect x="945" y="397" width="264" height="93" rx="17" fill="#eee8fb" stroke="#ac9cca" stroke-width="3"/>
  <text x="1077" y="431" class="node-title" text-anchor="middle">Human review</text>
  <text x="1077" y="463" class="small-text" text-anchor="middle">verdict + rationale</text>

  <rect x="1247" y="397" width="260" height="93" rx="17" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="1377" y="431" class="node-title" text-anchor="middle">Primary record</text>
  <text x="1377" y="461" class="small-text" text-anchor="middle">evidence + review if any</text>

  <rect x="68" y="566" width="1464" height="244" rx="25" fill="#fff6e8" stroke="#ebd0a9" stroke-width="3"/>
  <text x="91" y="607" class="band-title" fill="#8a5526">SUPPLEMENTAL-v1</text>
  <text x="356" y="607" class="band-subtitle">Later, internally registered evidence; primary results stay frozen</text>

  <path d="M 410 703 H 438" class="main-edge"/>
  <path d="M 759 703 H 788" class="main-edge"/>
  <path d="M 1094 703 H 1121" class="main-edge"/>
  <rect x="92" y="646" width="318" height="113" rx="18" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="251" y="685" class="node-title" text-anchor="middle">Saved inputs</text>
  <text x="251" y="714" class="node-text" text-anchor="middle">baseline + 15 candidates</text>
  <text x="251" y="740" class="small-text" text-anchor="middle">no new model calls</text>

  <rect x="438" y="646" width="321" height="113" rx="18" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="598" y="685" class="node-title" text-anchor="middle">Frozen case registry</text>
  <text x="598" y="716" class="node-text" text-anchor="middle">security · behavioral parity</text>
  <text x="598" y="742" class="small-text" text-anchor="middle">new robustness contract</text>

  <rect x="788" y="646" width="306" height="113" rx="18" fill="#ffffff" stroke="#b9c9de" stroke-width="3"/>
  <text x="941" y="685" class="node-title" text-anchor="middle">Separate outcomes</text>
  <text x="941" y="718" class="node-text" text-anchor="middle">pass · fail · inconclusive</text>

  <rect x="1121" y="646" width="386" height="113" rx="18" fill="#eee8fb" stroke="#ac9cca" stroke-width="3"/>
  <text x="1314" y="685" class="node-title" text-anchor="middle">Human follow-up</text>
  <text x="1314" y="714" class="node-text" text-anchor="middle">selected cases; later qualification</text>
  <text x="1314" y="741" class="small-text" text-anchor="middle">original records/metrics unchanged</text>

  <path d="M 1377 490 V 646" class="later-edge"/>
  <text x="1394" y="548" class="small-text" fill="#915b29">primary evidence</text>

  <text x="72" y="858" class="footer">No automatic approval or deployment. Copied workspaces protect study inputs; they are not security sandboxes.</text>
</svg>
